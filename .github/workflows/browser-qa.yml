name: Browser QA evidence

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Optional deterministic presentation seed for the capture run
        required: false
        default: rivet-run-highline-01
        type: string

permissions:
  contents: read

jobs:
  browser-smoke-and-capture:
    name: Chromium smoke test and player-height capture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      RIVET_RUN_URL: http://127.0.0.1:5173/?seed=${{ inputs.seed }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use pinned Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked JavaScript dependencies
        run: npm ci

      # Browser provisioning occurs explicitly in the runner before test/MCP-like work.
      # It is never attempted interactively by the application or a tool handshake.
      - name: Install Playwright Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium

      - name: Report resolved browser path
        run: |
          node --input-type=module -e "import { chromium } from '@playwright/test'; console.log('Chromium executable:', chromium.executablePath())"

      - name: Run browser smoke test
        run: npm run test:e2e

      - name: Start local game server for real capture
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > "$RUNNER_TEMP/rivet-run-vite.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/rivet-run-vite.pid"
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          echo 'Vite did not become ready.' >&2
          cat "$RUNNER_TEMP/rivet-run-vite.log" >&2 || true
          exit 1

      - name: Capture real first-person browser evidence
        run: |
          export BROWSER_EXECUTABLE_PATH="$(node --input-type=module -e "import { chromium } from '@playwright/test'; console.log(chromium.executablePath())")"
          node tools/qa/capture_visual_views.mjs

      - name: Stop local game server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/rivet-run-vite.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/rivet-run-vite.pid")" || true
          fi

      - name: Upload browser evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rivet-run-browser-qa-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            qa/visual/**/*.png
            qa/visual/**/*.zip
            qa/visual/playthrough_context.json
            playwright-report/
            test-results/
            ${{ runner.temp }}/rivet-run-vite.log

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Rivet Run browser QA'
            echo
            echo '- Chromium was provisioned explicitly before execution.'
            echo '- Smoke test and player-height capture results are available in the uploaded artifact.'
            echo '- Capture presence is evidence only; visual approval still requires hostile semantic inspection and the documented score threshold.'
          } >> "$GITHUB_STEP_SUMMARY"
